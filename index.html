<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GC Daily Report</title>

<!-- PapaParse CDN -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    margin:20px;
    background:#f5f7fa;
}

#reportHeading{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#fff;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    background:linear-gradient(90deg,#0072ff,#00c6ff);
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.filter-box{
    text-align:center;
    margin-bottom:20px;
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.filter-box select,
.filter-box input{
    padding: 8px;
    margin: 5px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 14px;
}

#loading{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border-radius: 8px;
    overflow: hidden;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#0072ff;
    color:white;
}

.status-present{
    background:#2ecc71;
    color:#fff;
    padding:4px 10px;
    border-radius:5px;
    font-weight:bold;
}

.status-absent{
    background:#e74c3c;
    color:#fff;
    padding:4px 10px;
    border-radius:5px;
    font-weight:bold;
}

.status-holiday{
    background:#3498db;
    color:#fff;
    padding:4px 10px;
    border-radius:5px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2 id="reportHeading">
🚇 GC Daily Report
</h2>

<div class="filter-box">
  <div>
    <label><b>Month:</b></label>
    <select id="monthFilter">
      <option value="">All Months</option>
      <option value="0">January</option>
      <option value="1">February</option>
      <option value="2">March</option>
      <option value="3">April</option>
      <option value="4">May</option>
      <option value="5">June</option>
      <option value="6">July</option>
      <option value="7">August</option>
      <option value="8">September</option>
      <option value="9">October</option>
      <option value="10">November</option>
      <option value="11">December</option>
    </select>

    <label><b>From:</b></label>
    <input type="date" id="fromDate">

    <label><b>To:</b></label>
    <input type="date" id="toDate">
  </div>

  <div style="margin-top: 10px;">
    <label><b>Line:</b></label>
    <select id="lineFilter"><option value="">All Lines</option></select>

    <label><b>Name:</b></label>
    <select id="nameFilter"><option value="">All Names</option></select>

    <label><b>Location:</b></label>
    <select id="locationFilter"><option value="">All Locations</option></select>

    <label><b>Status:</b></label>
    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="P">Present (P)</option>
      <option value="A">Absent (A)</option>
      <option value="H">Holiday (H)</option>
    </select>
  </div>
</div>

<div id="loading">
Loading data, please wait...
</div>

<table id="employeeTable">
  <thead></thead>
  <tbody></tbody>
</table>

<script>
const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpc4H0TN40P_UMrs-0DUaxXx4joitx5dylz5aB6V1fRSCBDySQbgBuyztbllxkfFNfMwkE6dXkkN34/pub?output=csv";

let allRows = [];

fetch(csvUrl)
  .then(res => res.text())
  .then(csvText => {
      const parsed = Papa.parse(csvText, { skipEmptyLines: true });
      allRows = parsed.data;

      populateDropdowns();
      createHeader();
      renderTable(allRows);

      document.getElementById("loading").style.display = "none";
  })
  .catch(error => {
      console.error(error);
      document.getElementById("loading").innerHTML = "Error loading data";
  });

function createHeader(){
    let thead = document.querySelector("#employeeTable thead");
    thead.innerHTML = `
    <tr>
        <th>Date</th>
        <th>Line</th>
        <th>Name</th>
        <th>Location</th>
        <th>Activity</th>
        <th>Status</th>
    </tr>`;
}

// Unique values ko dropdowns me bharein
function populateDropdowns(){
    let lines = new Set();
    let names = new Set();
    let locations = new Set();

    allRows.slice(1).forEach(row => {
        if(row[1]) lines.add(row[1].trim());
        if(row[2]) names.add(row[2].trim());
        if(row[3]) locations.add(row[3].trim());
    });

    let lineSelect = document.getElementById("lineFilter");
    lines.forEach(l => lineSelect.innerHTML += `<option value="${l}">${l}</option>`);

    let nameSelect = document.getElementById("nameFilter");
    names.forEach(n => nameSelect.innerHTML += `<option value="${n}">${n}</option>`);

    let locSelect = document.getElementById("locationFilter");
    locations.forEach(loc => locSelect.innerHTML += `<option value="${loc}">${loc}</option>`);
}

function renderTable(data){
    let tbody = document.querySelector("#employeeTable tbody");
    tbody.innerHTML = "";

    data.slice(1).forEach(row => {
        let tr = document.createElement("tr");

        for(let index = 0; index < 6; index++){
            let td = document.createElement("td");
            let col = row[index] ? row[index].toString().trim() : "";

            if(index === 0){
                // Date column me sirf date dikhane ke liye (agar sath me time ho to remove kar dega)
                td.textContent = col.split(' ')[0];
            }
            else if(index === 5){
                let status = col.toUpperCase();
                if(status === "P"){
                    td.innerHTML = '<span class="status-present">P</span>';
                }
                else if(status === "A"){
                    td.innerHTML = '<span class="status-absent">A</span>';
                }
                else if(status === "H"){
                    td.innerHTML = '<span class="status-holiday">H</span>';
                }
                else{
                    td.textContent = col;
                }
            }
            else{
                td.textContent = col;
            }

            tr.appendChild(td);
        }

        tbody.appendChild(tr);
    });
}

function applyFilters(){
    let month = document.getElementById("monthFilter").value;
    let fromDateVal = document.getElementById("fromDate").value;
    let toDateVal = document.getElementById("toDate").value;
    
    let selectedLine = document.getElementById("lineFilter").value.toLowerCase();
    let selectedName = document.getElementById("nameFilter").value.toLowerCase();
    let selectedLoc = document.getElementById("locationFilter").value.toLowerCase();
    let selectedStatus = document.getElementById("statusFilter").value.toUpperCase();

    let filtered = allRows.filter((row, index) => {
        if(index === 0) return true; // Header
        if(!row[0]) return false;

        let dateStr = row[0].split(' ')[0]; // Sirf date part lena
        let dateParts = dateStr.split("/");
        if(dateParts.length < 3) return false;

        let day = parseInt(dateParts[0], 10);
        let monthIdx = parseInt(dateParts[1], 10) - 1;
        let year = parseInt(dateParts[2], 10);
        let rowDate = new Date(year, monthIdx, day);

        // Month Filter
        if(month !== "" && rowDate.getMonth() != month) return false;

        // From Date Filter
        if(fromDateVal){
            let [fYear, fMonth, fDay] = fromDateVal.split("-").map(Number);
            if(rowDate < new Date(fYear, fMonth - 1, fDay)) return false;
        }

        // To Date Filter
        if(toDateVal){
            let [tYear, tMonth, tDay] = toDateVal.split("-").map(Number);
            if(rowDate > new Date(tYear, tMonth - 1, tDay)) return false;
        }

        // Column-wise Filters
        if(selectedLine && (!row[1] || row[1].toLowerCase().trim() !== selectedLine)) return false;
        if(selectedName && (!row[2] || row[2].toLowerCase().trim() !== selectedName)) return false;
        if(selectedLoc && (!row[3] || row[3].toLowerCase().trim() !== selectedLoc)) return false;
        if(selectedStatus && (!row[5] || row[5].toUpperCase().trim() !== selectedStatus)) return false;

        return true;
    });

    renderTable(filtered);
}

// Sabhi filters par event listeners lagana
document.getElementById("monthFilter").addEventListener("change", applyFilters);
document.getElementById("fromDate").addEventListener("change", applyFilters);
document.getElementById("toDate").addEventListener("change", applyFilters);
document.getElementById("lineFilter").addEventListener("change", applyFilters);
document.getElementById("nameFilter").addEventListener("change", applyFilters);
document.getElementById("locationFilter").addEventListener("change", applyFilters);
document.getElementById("statusFilter").addEventListener("change", applyFilters);
</script>

</body>
</html>
