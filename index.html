<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GC Daily Report</title>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    margin:20px;
    background:#f5f7fa;
}

#reportHeading{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#fff;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    background:linear-gradient(90deg,#0072ff,#00c6ff);
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.filter-box{
    text-align:center;
    margin-bottom:20px;
}

.filter-box select,
.filter-box input{
    padding:8px;
    margin:5px;
}

#loading{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#0072ff;
    color:white;
}

.status-present{
    background:#2ecc71;
    color:#fff;
    padding:4px 10px;
    border-radius:5px;
    font-weight:bold;
}

.status-absent{
    background:#e74c3c;
    color:#fff;
    padding:4px 10px;
    border-radius:5px;
    font-weight:bold;
}

.status-holiday{
    background:#3498db;
    color:#fff;
    padding:4px 10px;
    border-radius:5px;
    font-weight:bold;
}

</style>
</head>

<body>

<h2 id="reportHeading">
🚇 GC Daily Report
</h2>

<div class="filter-box">

<label><b>Month</b></label>

<select id="monthFilter">
<option value="">All Months</option>
<option value="0">January</option>
<option value="1">February</option>
<option value="2">March</option>
<option value="3">April</option>
<option value="4">May</option>
<option value="5">June</option>
<option value="6">July</option>
<option value="7">August</option>
<option value="8">September</option>
<option value="9">October</option>
<option value="10">November</option>
<option value="11">December</option>
</select>

<label><b>From</b></label>
<input type="date" id="fromDate">

<label><b>To</b></label>
<input type="date" id="toDate">

</div>

<div id="loading">
Loading data, please wait...
</div>

<table id="employeeTable">
<thead></thead>
<tbody></tbody>
</table>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRpc4H0TN40P_UMrs-0DUaxXx4joitx5dylz5aB6V1fRSCBDySQbgBuyztbllxkfFNfMwkE6dXkkN34/pub?output=csv";

let allRows = [];

fetch(csvUrl)

.then(res => res.text())

.then(data => {

    const rows = data
        .trim()
        .split('\n')
        .map(row => row.split(','));

    allRows = rows;

    createHeader(rows[0]);

    renderTable(rows);

    document.getElementById("loading").style.display = "none";

})

.catch(error => {

    console.error(error);

    document.getElementById("loading").innerHTML =
    "Error loading data";

});

function createHeader(headers){

    let thead =
    document.querySelector("#employeeTable thead");

    let tr =
    document.createElement("tr");

    headers.forEach(head => {

        let th =
        document.createElement("th");

        th.textContent = head;

        tr.appendChild(th);

    });

    thead.appendChild(tr);
}

function renderTable(data){

    let tbody =
    document.querySelector("#employeeTable tbody");

    tbody.innerHTML = "";

    data.slice(1).forEach(row => {

        let tr =
        document.createElement("tr");

        row.forEach((col,index)=>{

            let td =
            document.createElement("td");

            if(index === 5){

                let status =
                col.trim().toUpperCase();

                if(status === "P"){

                    td.innerHTML =
                    '<span class="status-present">Present</span>';

                }

                else if(status === "A"){

                    td.innerHTML =
                    '<span class="status-absent">Absent</span>';

                }

                else if(status === "H"){

                    td.innerHTML =
                    '<span class="status-holiday">Holiday</span>';

                }

                else{

                    td.textContent = col;

                }

            }

            else{

                td.innerHTML
