<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GC Daily Report</title>

<!-- PapaParse CDN -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    margin:20px;
    background:#f5f7fa;
}

#reportHeading{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#fff;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    background:linear-gradient(90deg,#0072ff,#00c6ff);
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.filter-box{
    text-align:center;
    margin-bottom:20px;
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.filter-box select,
.filter-box input{
    padding: 8px;
    margin: 5px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 14px;
}

#loading{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border-radius: 8px;
    overflow: hidden;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#0072ff;
    color:white;
}

/* Table ke andar wale column filters ki styling */
.col-filter {
    width: 90%;
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 12px;
}

.status-present{
    background:#2ecc71;
    color:#fff;
    padding:4px 10px;
    border-radius:5px;
    font-weight:bold;
}

.status-absent{
    background:#e74c3c;
    color:#fff;
    padding:4px 10px;
    border-radius:5px;
    font-weight:bold;
}

.status-holiday{
    background:#3498db;
    color:#fff;
    padding:4px 10px;
    border-radius:5px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2 id="reportHeading">
🚇 GC Daily Report
</h2>

<!-- Top Main Filters (Month, From, To) -->
<div class="filter-box">
  <label><b>Month</b></label>
  <select id="monthFilter">
    <option value="">All Months</option>
    <option value="0">January</option>
    <option value="1">February</option>
    <option value="2">March</option>
    <option value="3">April</option>
    <option value="4">May</option>
    <option value="5">June</option>
    <option value="6">July</option>
    <option value="7">August</option>
    <option value="8">September</option>
    <option value="9">October</option>
    <option value="10">November</option>
    <option value="11">December</option>
  </select>

  <label><b>From</b></label>
  <input type="date" id="fromDate">

  <label><b>To</b></label>
  <input type="date" id="toDate">
</div>

<div id="loading">
Loading data, please wait...
</div>

<table id="employeeTable">
  <thead>
    <!-- Row 1: Column Names -->
    <tr>
        <th>Date</th>
        <th>Line</th>
        <th>Name</th>
        <th>Location</th>
        <th>Activity</th>
        <th>Status</th>
    </tr>
    <!-- Row 2: Column-wise Filters -->
    <tr>
        <th><input type="text" id="tableDateFilter" class="col-filter" placeholder="Filter Date..."></th>
        <th><select id="tableLineFilter" class="col-filter"><option value="">All</option></select></th>
        <th><select id="tableNameFilter" class="col-filter"><option value="">All</option></select></th>
        <th><select id="tableLocFilter" class="col-filter"><option value="">All</option></select></th>
        <th><input type="text" id="tableActivityFilter" class="col-filter" placeholder="Search Activity..."></th>
        <th>
            <select id="tableStatusFilter" class="col-filter">
                <option value="">All</option>
                <option value="P">P</option>
                <option value="A">A</option>
                <option value="H">H</option>
            </select>
        </th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpc4H0TN40P_UMrs-0DUaxXx4joitx5dylz5aB6V1fRSCBDySQbgBuyztbllxkfFNfMwkE6dXkkN34/pub?output=csv";

let allRows = [];

fetch(csvUrl)
  .then(res => res.text())
  .then(csvText => {
      const parsed = Papa.parse(csvText, { skipEmptyLines: true });
      allRows = parsed.data;

      populateTableDropdowns();
      renderTable(allRows);

      document.getElementById("loading").style.display = "none";
  })
  .catch(error => {
      console.error(error);
      document.getElementById("loading").innerHTML = "Error loading data";
  });

// Table ke andar wale dropdowns ko data se bharna
function populateTableDropdowns(){
    let lines = new Set();
    let names = new Set();
    let locations = new Set();

    allRows.slice(1).forEach(row => {
        if(row[1]) lines.add(row[1].trim());
        if(row[2]) names.add(row[2].trim());
        if(row[3]) locations.add(row[3].trim());
    });

    let lineSel = document.getElementById("tableLineFilter");
    Array.from(lines).sort().forEach(l => lineSel.innerHTML += `<option value="${l}">${l}</option>`);

    let nameSel = document.getElementById("tableNameFilter");
    Array.from(names).sort().forEach(n => nameSel.innerHTML += `<option value="${n}">${n}</option>`);

    let locSel = document.getElementById("tableLocFilter");
    Array.from(locations).sort().forEach(loc => locSel.innerHTML += `<option value="${loc}">${loc}</option>`);
}

function renderTable(data){
    let tbody = document.querySelector("#employeeTable tbody");
    tbody.innerHTML = "";

    data.slice(1).forEach(row => {
        let tr = document.createElement("tr");

        for(let index = 0; index < 6; index++){
            let td = document.createElement("td");
            let col = row[index] ? row[index].toString().trim() : "";

            if(index === 0){
                // Date column me sirf clean date dikhane ke liye
                td.textContent = col.split(' ')[0];
            }
            else if(index === 5){
                let status = col.toUpperCase();
                if(status === "P"){
                    td.innerHTML = '<span class="status-present">P</span>';
                }
                else if(status === "A"){
                    td.innerHTML = '<span class="status-absent">A</span>';
                }
                else if(status === "H"){
                    td.innerHTML = '<span class="status-holiday">H</span>';
                }
                else{
                    td.textContent = col;
                }
            }
            else{
                td.textContent = col;
            }

            tr.appendChild(td);
        }

        tbody.appendChild(tr);
    });
}

function applyFilters(){
    let month = document.getElementById("monthFilter").value;
    let fromDateVal = document.getElementById("fromDate").value;
    let toDateVal = document.getElementById("toDate").value;
    
    // Column Filters
    let tDate = document.getElementById("tableDateFilter").value.trim().toLowerCase();
    let tLine = document.getElementById("tableLineFilter").value.trim().toLowerCase();
    let tName = document.getElementById("tableNameFilter").value.trim().toLowerCase();
    let tLoc = document.getElementById("tableLocFilter").value.trim().toLowerCase();
    let tActivity = document.getElementById("tableActivityFilter").value.trim().toLowerCase();
    let tStatus = document.getElementById("tableStatusFilter").value.toUpperCase().trim();

    let filtered = allRows.filter((row, index) => {
        if(index === 0) return true;
        if(!row[0]) return false;

        let dateStr = row[0].split(' ')[0];
        let dateParts = dateStr.split("/");
        if(dateParts.length < 3) return false;

        let day = parseInt(dateParts[0], 10);
        let monthIdx = parseInt(dateParts[1], 10) - 1;
        let year = parseInt(dateParts[2], 10);
        let rowDate = new Date(year, monthIdx, day);

        // Top Month Filter
        if(month !== "" && rowDate.getMonth() != month) return false;

        // Top From Date Filter
        if(fromDateVal){
            let [fYear, fMonth, fDay] = fromDateVal.split("-").map(Number);
            if(rowDate < new Date(fYear, fMonth - 1, fDay)) return false;
        }

        // Top To Date Filter
        if(toDateVal){
            let [tYear, tMonth, tDay] = toDateVal.split("-").map(Number);
            if(rowDate > new Date(tYear, tMonth - 1, tDay)) return false;
        }

        // Column-wise Table Filters
        if(tDate && !dateStr.toLowerCase().includes(tDate)) return false;
        if(tLine && (!row[1] || row[1].trim().toLowerCase() !== tLine)) return false;
        if(tName && (!row[2] || row[2].trim().toLowerCase() !== tName)) return false;
        if(tLoc && (!row[3] || row[3].trim().toLowerCase() !== tLoc)) return false;
        if(tActivity && (!row[4] || !row[4].trim().toLowerCase().includes(tActivity))) return false;
        if(tStatus && (!row[5] || row[5].trim().toUpperCase() !== tStatus)) return false;

        return true;
    });

    renderTable(filtered);
}

// Event Listeners for all filters
document.getElementById("monthFilter").addEventListener("change", applyFilters);
document.getElementById("fromDate").addEventListener("change", applyFilters);
document.getElementById("toDate").addEventListener("change", applyFilters);

document.getElementById("tableDateFilter").addEventListener("input", applyFilters);
document.getElementById("tableLineFilter").addEventListener("change", applyFilters);
document.getElementById("tableNameFilter").addEventListener("change", applyFilters);
document.getElementById("tableLocFilter").addEventListener("change", applyFilters);
document.getElementById("tableActivityFilter").addEventListener("input", applyFilters);
document.getElementById("tableStatusFilter").addEventListener("change", applyFilters);
</script>

</body>
</html>
